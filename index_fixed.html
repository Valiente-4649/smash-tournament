<script type="module">

import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyDVOpwr89QumJoa0RH06Vk99lOvUxDee8A',authDomain:'smash-tournament-7d620.firebaseapp.com',databaseURL:'https://smash-tournament-7d620-default-rtdb.firebaseio.com',projectId:'smash-tournament-7d620',storageBucket:'smash-tournament-7d620.firebasestorage.app',messagingSenderId:'883349497921',appId:'1:883349497921:web:40e3489325f0d1770c7ec0',measurementId:'G-JQLHX9GZK6'};
const ADMIN_UID='yBn5daLPV2bQ3q8A4nJuzDgSRfO2';
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const eventRef=doc(db,'events','main'); const playersRef=collection(eventRef,'players'); const matchesRef=collection(eventRef,'matches');
let currentUser=null,event={status:'registration',name:'Smash Tournament',switches:2},players=[],matches=[],unsubs=[];
let authInitialized=false;
let resolveAuthReady;
const authReady=new Promise(resolve=>{resolveAuthReady=resolve});
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function admin(){return currentUser?.uid===ADMIN_UID}
function setPage(id){['viewPage','registerPage','adminPage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));['tabView','tabRegister','tabAdmin'].forEach(x=>$(x).classList.toggle('active',x.replace('tab','').toLowerCase()===id.replace('Page','').toLowerCase()))}
$('tabView').onclick=()=>setPage('viewPage'); $('tabRegister').onclick=()=>setPage('registerPage'); $('tabAdmin').onclick=()=>setPage('adminPage');
function rounds(n){return Math.ceil(Math.log2(Math.max(2,n)))}
function labelRound(r,total){if(r===total)return '決勝';if(r===total-1)return '準決勝';if(r===total-2)return '準々決勝';return `WB R${r}`}
function boFor(match){
  // 準決勝まではBO3、準決勝からBO5。
  // WB: R-1（準決勝）以降をBO5。
  // LB: R-1以降を同等の大会ステージとしてBO5。
  if(match.bracket==='GF') return 'BO5';
  return match.round>=match.wbTotal-1?'BO5':'BO3';
}
function requiredWins(match){return boFor(match)==='BO5'?3:2}
function playerName(id){return players.find(p=>p.id===id)?.name || (id?'Unknown':'未定')}
function normalizePlayers(ps){let n=1;while(n<ps.length)n*=2;return n}
function makeBracket(ps){
  const N=normalizePlayers(ps), R=Math.log2(N), slots=Array.from({length:N},(_,i)=>ps[i]?.id||null); const out=[];
  // deterministic seeded-ish order; for casual club event, keep registration order.
  for(let r=1;r<=R;r++){
    const count=N/2**r;
    for(let i=0;i<count;i++){
      let p1=null,p2=null;
      if(r===1){p1=slots[i*2]||null;p2=slots[i*2+1]||null}
      out.push({id:`wb${r}-${i+1}`,bracket:'WB',round:r,index:i+1,wbTotal:R,p1,p2,s1:0,s2:0,status:'pending',table:null,winner:null,loser:null,source1:null,source2:null});
    }
  }
  // winner bracket sources
  for(let r=2;r<=R;r++) for(let i=0;i<N/2**r;i++){let m=out.find(x=>x.id===`wb${r}-${i+1}`);m.source1=`wb${r-1}-${i*2+1}`;m.source2=`wb${r-1}-${i*2+2}`}
  // loser bracket: 2R-1 rounds, sizes N/4,N/4,N/8,N/8,...,1,1
  let sizes=[]; for(let k=1;k<=2*R-1;k++) sizes.push(Math.max(1,Math.floor(N/2**Math.ceil((k+1)/2)))); if(R===1)sizes=[];
  for(let k=1;k<=sizes.length;k++) for(let i=0;i<sizes[k-1];i++) out.push({id:`lb${k}-${i+1}`,bracket:'LB',round:k,index:i+1,wbTotal:R,p1:null,p2:null,s1:0,s2:0,status:'pending',table:null,winner:null,loser:null,source1:null,source2:null});
  // LB source mapping
  for(let k=1;k<=sizes.length;k++){
    const size=sizes[k-1];
    for(let i=0;i<size;i++){
      const m=out.find(x=>x.id===`lb${k}-${i+1}`);
      if(k===1){m.source1=`wb1-${i*2+1}`;m.source2=`wb1-${i*2+2}`}
      else if(k%2===0){ // even LB round receives previous LB winners + next WB round losers
        m.source1=`lb${k-1}-${i+1}`; const wbRound=k/2+1; m.source2=wbRound<=R?`wb${wbRound}-${i+1}`:null;
      } else { // odd LB round after even: pair previous LB winners
        m.source1=`lb${k-1}-${i*2+1}`;m.source2=`lb${k-1}-${i*2+2}`;
      }
    }
  }
  if(R>=1) out.push({id:'GF-1',bracket:'GF',round:1,index:1,wbTotal:R,p1:null,p2:null,s1:0,s2:0,status:'pending',table:null,winner:null,loser:null,source1:`wb${R}-1`,source2:sizes.length?`lb${sizes.length}-1`:null});
  return out;
}
function refreshSources(ms){
  const map=Object.fromEntries(ms.map(m=>[m.id,m]));
  let changed=true, guard=0;
  while(changed&&guard++<20){changed=false;
    for(const m of ms){if(m.status==='done')continue; const before=m.p1+'|'+m.p2; if(m.source1){const s=map[m.source1]; if(s?.status==='done')m.p1=s.winner||null;}
      if(m.source2){const s=map[m.source2]; if(s?.status==='done')m.p2=s.winner||null;}
      const after=m.p1+'|'+m.p2;if(before!==after)changed=true;
      // if one source match is completed and its opponent was a bye/empty, winner flows naturally.
    }
  }
  return ms;
}
function autoByes(ms){
  const map=Object.fromEntries(ms.map(m=>[m.id,m])); let did=false;
  for(const m of ms){
    if(m.status!=='pending')continue;
    // A match is actionable once both source matches are resolved, or for WB R1 immediately.
    const sourceReady=s=>!s || map[s]?.status==='done';
    if(!sourceReady(m.source1)||!sourceReady(m.source2))continue;
    const a=m.p1,b=m.p2;
    if(a&&!b){m.status='done';m.winner=a;m.loser=null;m.s1=requiredWins(m);m.s2=0;did=true}
    else if(!a&&b){m.status='done';m.winner=b;m.loser=null;m.s1=0;m.s2=requiredWins(m);did=true}
    else if(!a&&!b){/* remains waiting for upstream */}
  }
  return did;
}
function ready(m){return m.status==='pending' && !!m.p1 && !!m.p2}
function matchOrder(m){if(m.bracket==='WB')return m.round*1000+m.index;if(m.bracket==='LB')return 10000+m.round*1000+m.index;return 30000}
function updateStatuses(ms){
  for(const m of ms){if(m.status==='done')continue; if(ready(m)&&!m.table)m.status='waiting';}
  const active=ms.filter(m=>m.status==='playing').sort((a,b)=>matchOrder(a)-matchOrder(b));
  const waiting=ms.filter(m=>m.status==='waiting').sort((a,b)=>matchOrder(a)-matchOrder(b));
  return {active,waiting};
}
async function reconcileAndAssign(){
  if(!admin()||event.status!=='started')return;
  const fresh=matches.map(m=>({...m}));
  const map=Object.fromEntries(fresh.map(m=>[m.id,m]));
  refreshSources(fresh);
  autoByes(fresh);
  for(const m of fresh){
    if(m.status==='done')continue;
    if(ready(m)&&m.status==='pending')m.status='waiting';
  }
  const batch=writeBatch(db); let writes=0;
  for(const m of fresh){
    const old=map[m.id];
    const patch={};
    if(m.p1!==old.p1)patch.p1=m.p1||null;
    if(m.p2!==old.p2)patch.p2=m.p2||null;
    if(m.status!==old.status)patch.status=m.status;
    if(m.winner!==old.winner)patch.winner=m.winner||null;
    if(m.loser!==old.loser)patch.loser=m.loser||null;
    if(m.s1!==old.s1)patch.s1=m.s1;
    if(m.s2!==old.s2)patch.s2=m.s2;
    if(Object.keys(patch).length){batch.update(doc(matchesRef,m.id),patch);writes++}
  }
  if(writes)await batch.commit();
  // Use the reconciled local state to fill every free table, in match order.
  const occupied=new Set(fresh.filter(m=>m.status==='playing'&&m.table).map(m=>m.table));
  const free=[]; for(let i=1;i<=Number(event.switches||1);i++)if(!occupied.has(i))free.push(i);
  const candidates=fresh.filter(m=>m.status==='waiting'&&m.p1&&m.p2).sort((a,b)=>matchOrder(a)-matchOrder(b));
  const b2=writeBatch(db); let w2=0;
  for(const m of candidates){if(!free.length)break;const table=free.shift();b2.update(doc(matchesRef,m.id),{status:'playing',table});w2++}
  if(w2)await b2.commit();
}
async function assignTables(){return reconcileAndAssign()}
async function completeMatch(id,winnerScore,loserScore){
  if(!admin())return; const m=matches.find(x=>x.id===id); if(!m||m.status==='done'||!m.p1||!m.p2)return;
  const need=requiredWins(m); if(winnerScore<need||loserScore>=need||winnerScore<=loserScore)throw Error(`スコアが不正です。${boFor(m)}では勝者が${need}ゲーム必要です。`);
  const winner=m.s1>=m.s2?m.p1:m.p2; // not used; scores passed below correspond to selected winner in UI
}
async function saveResult(id,winnerId,ws,ls){
  if(!admin())return;const m=matches.find(x=>x.id===id);if(!m)return; const need=requiredWins(m); if(ws!==need||ls<0||ls>=need)throw Error(`${boFor(m)}の結果として入力できないスコアです。`);
  await updateDoc(doc(matchesRef,id),{s1:m.p1===winnerId?ws:ls,s2:m.p2===winnerId?ws:ls,status:'done',table:null,winner:winnerId,loser:m.p1===winnerId?m.p2:m.p1,finishedAt:serverTimestamp()});
  setTimeout(reconcileAndAssign,150);
}
async function deleteAllMatches(){const snap=await getDocs(matchesRef);const batch=writeBatch(db);snap.forEach(d=>batch.delete(d.ref));await batch.commit()}
async function startTournament(){
  if(!admin())return; if(event.status==='started')return; if(players.length<2){$('adminMsg').textContent='参加者が2人以上必要です。';return}
  const built=makeBracket(players); await deleteAllMatches(); const batch=writeBatch(db); built.forEach(m=>batch.set(doc(matchesRef,m.id),m));
  batch.set(eventRef,{status:'started',startedAt:serverTimestamp(),playerCount:players.length},{merge:true}); await batch.commit(); $('adminMsg').textContent='大会を開始しました！'; setTimeout(reconcileAndAssign,300);
}
function render(){
  $('eventSub').textContent=event.name||'Smash Tournament'; $('statusPill').textContent=event.status==='started'?'大会進行中':'参加受付中';
  const playing=matches.filter(m=>m.status==='playing'); $('playing').innerHTML=playing.length?playing.map(m=>`<div class="match playing"><div class="match-head"><b>台${m.table}</b><span class="tag">${esc(boFor(m))}</span></div><div class="scoreline"><div>${esc(playerName(m.p1))}<br>${esc(playerName(m.p2))}</div><div class="score">${m.s1} - ${m.s2}</div></div></div>`).join(''):'<div class="muted">現在プレイ中の試合はありません。</div>';
  $('overview').innerHTML=`<div class="row"><span class="pill">${event.status==='started'?'進行中':'受付中'}</span><span class="pill">参加者 ${players.length}人</span><span class="pill">台 ${Number(event.switches||1)}台</span><span class="pill">準決勝までBO3</span><span class="pill">準決勝からBO5</span></div><p class="muted">${event.status==='started'?'試合は上から順番に自動割り当てされます。':'参加登録後、管理者が「大会開始」を押すと対戦表が生成されます。'}</p>`;
  $('playerList').innerHTML=players.length?players.map((p,i)=>`<div class="player"><b>${i+1}. ${esc(p.name)}</b></div>`).join(''):'<div class="muted">まだ参加者はいません。</div>';
  $('regPlayers').innerHTML=$('playerList').innerHTML;
  const sorted=[...matches].sort((a,b)=>matchOrder(a)-matchOrder(b)); $('matchList').innerHTML=sorted.length?sorted.map(m=>matchHTML(m,false)).join(''):'<div class="muted">大会開始後に試合が表示されます。</div>';
  if(admin()){$('adminMatches').innerHTML=sorted.map(m=>matchHTML(m,true)).join('');}
  renderBracket();
  $('eventNameInput').value=event.name||'';$('switchesInput').value=event.switches||2;
  const registered=currentUser && players.some(p=>p.id===currentUser.uid);
  const regBtn=$('registerBtn');
  if(event.status==='started'){
    $('regNotice').textContent='大会は開始済みのため参加登録できません。';
    regBtn.disabled=true; regBtn.textContent='参加受付終了';
  }else if(admin()){
    $('regNotice').textContent='管理者としてログイン中です。参加登録する場合は管理者からログアウトしてください。';
    regBtn.disabled=true; regBtn.textContent='管理者ログイン中';
  }else if(!currentUser){
    $('regNotice').textContent='参加者用の匿名ログインを準備中です…';
    regBtn.disabled=true; regBtn.textContent='認証中…';
  }else if(registered){
    $('regNotice').textContent='この端末ではすでに参加登録済みです。別の名前では登録できません。';
    regBtn.disabled=true; regBtn.textContent='登録済み';
  }else{
    $('regNotice').textContent='匿名ログイン済み。名前を入力して登録できます。';
    regBtn.disabled=false; regBtn.textContent='この名前で参加登録';
  }
}
function matchHTML(m,adminMode){
  const round=m.bracket==='WB'?labelRound(m.round,m.wbTotal):m.bracket==='LB'?`LB R${m.round}`:'決勝'; const state=m.status==='playing'?`台${m.table}・プレイ中`:m.status==='waiting'?'待機中':m.status==='done'?'終了':'未確定';
  let controls=''; if(adminMode&&m.status==='playing'&&m.p1&&m.p2){const n=requiredWins(m);const loserScores=Array.from({length:n},(_,i)=>i);controls=`<div class="row" style="margin-top:10px">${[m.p1,m.p2].flatMap(winner=>loserScores.map(ls=>`<button data-result="${m.id}" data-winner="${winner}" data-loser-score="${ls}">${esc(playerName(winner))} 勝 ${n}-${ls}</button>`)).join('')}</div>`}
  return `<div class="match ${m.status==='playing'?'playing':''} ${m.status==='done'?'done':''}"><div class="match-head"><b>${round} #${m.index}</b><span class="tag">${state} / ${boFor(m)}</span></div><div class="scoreline"><div>${esc(playerName(m.p1))}<br>${esc(playerName(m.p2))}</div><div class="score">${m.s1} - ${m.s2}</div></div>${m.winner?`<div class="small muted">勝者：${esc(playerName(m.winner))}</div>`:''}${controls}</div>`;
}
function renderBracket(){
 const wb=matches.filter(m=>m.bracket==='WB').sort((a,b)=>a.round-b.round||a.index-b.index);const lb=matches.filter(m=>m.bracket==='LB').sort((a,b)=>a.round-b.round||a.index-b.index);const gf=matches.filter(m=>m.bracket==='GF');
 if(!matches.length){$('bracket').innerHTML='<div class="muted">大会開始後にトーナメントが表示されます。</div>';return}
 const groups=[];for(let r=1;r<=Math.max(1,...wb.map(m=>m.round));r++)groups.push({name:labelRound(r,Math.max(...wb.map(m=>m.wbTotal))),ms:wb.filter(m=>m.round===r)});for(let r=1;r<=Math.max(0,...lb.map(m=>m.round));r++)groups.push({name:`敗者 R${r}`,ms:lb.filter(m=>m.round===r)});if(gf.length)groups.push({name:'決勝',ms:gf});
 $('bracket').innerHTML='<div class="rounds">'+groups.map(g=>`<div class="round"><h4>${g.name}</h4>${g.ms.map(m=>`<div class="match ${m.status==='playing'?'playing':''}"><div class="small">${m.status==='playing'?`台${m.table}・`:''}${m.status}</div><b>${esc(playerName(m.p1))}</b> <span class="score">${m.s1}</span><br><b>${esc(playerName(m.p2))}</b> <span class="score">${m.s2}</span></div>`).join('')}</div>`).join('')+'</div>';
}
async function bootstrapAnon(){
  try{
    // Firebase Authの初期化完了を待つ。管理者がログイン済みなら匿名ログインを上書きしない。
    await authReady;
    if(currentUser) return;
    await signInAnonymously(auth);
  }catch(e){
    $('authPill').textContent='匿名ログイン失敗';
    $('regNotice').textContent='匿名ログインに失敗しました。ページを再読み込みしてください。';
    console.error('Anonymous auth error:',e.code,e.message,e);
    render();
  }
}
onAuthStateChanged(auth,u=>{
  currentUser=u;
  if(!authInitialized){authInitialized=true;resolveAuthReady(u);}
  $('authPill').textContent=u?(admin()?'管理者ログイン済み':'参加者モード'):'未ログイン';
  $('loginCard').classList.toggle('hidden',admin());
  $('adminCard').classList.toggle('hidden',!admin());
  $('adminMatchesCard').classList.toggle('hidden',!admin());
  if(admin())$('adminUser').textContent=`管理者UID: ${u.uid}`;
  render();
});
function subscribe(){unsubs.forEach(f=>f());unsubs=[];unsubs.push(onSnapshot(eventRef,s=>{event=s.exists()?{...event,...s.data()}:{...event};render()}));unsubs.push(onSnapshot(query(playersRef,orderBy('createdAt','asc')),s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(onSnapshot(matchesRef,s=>{matches=s.docs.map(d=>({id:d.id,...d.data()}));render()}));}
$('registerBtn').onclick=async()=>{
  const btn=$('registerBtn'), notice=$('regError');
  notice.classList.add('hidden');
  const name=$('nameInput').value.trim();
  if(!name){notice.textContent='プレイヤー名を入力してください。';notice.classList.remove('hidden');return;}
  if(event.status==='started'){notice.textContent='大会はすでに開始されています。';notice.classList.remove('hidden');return;}
  if(admin()){notice.textContent='管理者ログイン中は参加登録できません。ログアウトしてから登録してください。';notice.classList.remove('hidden');return;}
  btn.disabled=true; btn.textContent='登録中…';
  try{
    await authReady;
    if(!currentUser) await signInAnonymously(auth);
    if(!currentUser) throw new Error('参加者用ログインを確認できませんでした。ページを再読み込みしてください。');
    if(players.some(p=>p.id===currentUser.uid)){
      notice.textContent='この端末ではすでに参加登録済みです。';
      notice.classList.remove('hidden');
      render();
      return;
    }
    await setDoc(doc(playersRef,currentUser.uid),{uid:currentUser.uid,name,createdAt:serverTimestamp()});
    $('nameInput').value='';
    $('regNotice').textContent=`「${name}」で参加登録しました！`;
    notice.textContent='登録完了！大会の参加者一覧に反映されました。';
    notice.classList.remove('hidden');
  }catch(e){
    console.error('Registration error:',e.code,e.message,e);
    notice.textContent=`登録に失敗しました。${e.code?` (${e.code})`:''} ${e.message||''}`;
    notice.classList.remove('hidden');
  }finally{
    render();
  }
};
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('adminEmail').value.trim(),$('adminPass').value);$('loginMsg').textContent='ログインしました。';}catch(e){$('loginMsg').textContent='ログイン失敗: '+e.message}};
$('logoutBtn').onclick=()=>signOut(auth).then(()=>bootstrapAnon());
$('saveSettingsBtn').onclick=async()=>{if(!admin())return;const name=$('eventNameInput').value.trim()||'Smash Tournament',sw=Math.max(1,Math.min(32,Number($('switchesInput').value)||1));await setDoc(eventRef,{name,switches:sw,status:event.status||'registration'},{merge:true});$('adminMsg').textContent='設定を保存しました。';setTimeout(reconcileAndAssign,100)};
$('startBtn').onclick=async()=>{if(confirm(`参加者${players.length}人で大会を開始します。開始後は参加登録できません。よろしいですか？`))await startTournament()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-result]');if(!b||!admin())return;const m=matches.find(x=>x.id===b.dataset.result);if(!m)return;const winner=b.dataset.winner;const ls=Number(b.dataset.loserScore||0),ws=requiredWins(m);if(!confirm(`${playerName(winner)} の勝利 ${ws}-${ls} で確定しますか？`))return;try{await saveResult(m.id,winner,ws,ls)}catch(err){alert(err.message)}});
subscribe();bootstrapAnon();
