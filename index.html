<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smash Campus Cup</title>
<style>
:root{--bg:#0b1020;--card:#121a2d;--card2:#18223a;--text:#f4f7ff;--muted:#9aa8c7;--accent:#6d7cff;--danger:#ff5d73;--ok:#4bd38b;--line:#2b3857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{padding:22px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,16,32,.94);backdrop-filter:blur(10px);z-index:3}
.wrap{max-width:1050px;margin:auto}.brand{font-size:22px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:3px}
main{padding:18px 12px 60px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#0e1628;color:var(--text);padding:9px 12px;font-size:16px}
button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);padding:9px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
.form{display:grid;grid-template-columns:1fr auto;gap:8px}.list{display:grid;gap:7px;margin-top:10px}.person{padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#222e4d;font-size:12px;font-weight:800}.live{background:#173f32;color:#74e0a8}.wait{background:#342e19;color:#ffd66e}.done{background:#252a39;color:#aab5d0}
.matches{display:grid;gap:10px}.match{border:1px solid var(--line);border-radius:14px;padding:13px;background:#10182a}.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0}.p{padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:800}.score{font-size:20px;font-weight:900}.center{text-align:center}.tiny{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab.active{background:var(--accent)}
.bracket{overflow-x:auto;padding-bottom:5px}.bracket-inner{display:flex;gap:16px;min-width:720px}.round{width:220px}.round h3{font-size:13px;color:var(--muted)}.bm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0}
.notice{padding:10px 12px;border-radius:10px;background:#171f35;color:var(--muted);font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.bracket-inner{min-width:700px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="title">Smash Campus Cup</div><div class="sub">Double Elimination · BO2 / 準決勝からBO3</div></div></header>
<main class="wrap">
<div id="notice" class="notice" style="margin-bottom:16px">デモモードです。Firebase設定を入れると参加者全員でリアルタイム共有できます。</div>
<div class="grid">
<section>
<div class="card" id="registerCard">
<h2>参加登録</h2><div class="muted" id="regState">大会開始前です</div>
<form class="form" id="regForm" style="margin-top:10px"><input id="playerName" maxlength="24" placeholder="ニックネーム"><button class="primary">登録</button></form>
<div class="list" id="playerList"></div>
</div>
<div class="card">
<h2>大会設定</h2>
<div class="row"><label style="flex:1"><span class="muted">Switch台数</span><input id="switchCount" type="number" min="1" max="32" value="4"></label>
<label style="flex:1"><span class="muted">大会名</span><input id="eventName" value="Smash Campus Cup"></label></div>
<button id="startBtn" class="primary" style="width:100%;margin-top:10px">管理者として大会を開始</button>
<div class="muted" style="margin-top:8px">※本番ではFirebase Authentication等で管理者を保護してください。</div>
</div>
</section>
<section>
<div class="card">
<div class="tabs"><button class="tab active" data-tab="live">対戦状況</button><button class="tab" data-tab="bracket">トーナメント</button></div>
<div id="liveTab">
<h2>現在の対戦</h2><div id="liveMatches" class="matches"></div>
<h2 style="margin-top:18px">対戦待ち</h2><div id="waiting" class="matches"></div>
</div>
<div id="bracketTab" style="display:none"><div class="bracket"><div id="bracket" class="bracket-inner"></div></div></div>
</div>
</section>
</div>
</main>
<script>
const state={players:[],started:false,switches:4,eventName:"Smash Campus Cup",matches:[],next:1};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("smash-demo",JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem("smash-demo"));if(x)Object.assign(state,x)}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
$("title").textContent=state.eventName;
$("switchCount").value=state.switches;
$("eventName").value=state.eventName;
$("regState").textContent=state.started?"参加登録は締め切られています":`現在 ${state.players.length} 人`;
$("playerName").disabled=state.started;$("regForm").querySelector("button").disabled=state.started;$("startBtn").disabled=state.started;
$("playerList").innerHTML=state.players.map((p,i)=>`<div class="person"><span>${i+1}. ${esc(p)}</span><span class="tiny">${state.started?"参加確定":"登録中"}</span></div>`).join("");
const live=state.matches.filter(m=>m.status==="playing");
$("liveMatches").innerHTML=live.length?live.map(matchHTML).join(""):`<div class="notice">現在対戦中の試合はありません。</div>`;
const wait=state.matches.filter(m=>m.status==="waiting");
$("waiting").innerHTML=wait.length?wait.map(m=>`<div class="match"><span class="badge wait">対戦待ち</span><div class="players"><div class="p">${esc(m.p1)}</div><div class="tiny">vs</div><div class="p">${esc(m.p2)}</div></div><div class="tiny">R${m.round} · ${m.best===3?"BO3":"BO2"}</div></div>`).join(""):`<div class="notice">待機中の試合はありません。</div>`;
renderBracket();
}
function matchHTML(m){
return `<div class="match"><div class="row" style="justify-content:space-between"><span class="badge live">対戦中</span><b>🎮 台 ${m.table}</b></div><div class="players"><div class="p">${esc(m.p1)}<div class="tiny">${m.s1}勝</div></div><div class="score">${m.s1}-${m.s2}</div><div class="p">${esc(m.p2)}<div class="tiny">${m.s2}勝</div></div></div><div class="row"><button onclick="score(${m.id},1)" style="flex:1">${esc(m.p1)} 勝ち</button><button onclick="score(${m.id},2)" style="flex:1">${esc(m.p2)} 勝ち</button></div><div class="center tiny" style="margin-top:7px">${m.best===3?"BO3":"BO2"} · R${m.round}</div></div>`;
}
function score(id,side){let m=state.matches.find(x=>x.id===id);if(!m)return;if(side===1)m.s1++;else m.s2++;let need=m.best===3?2:1;if((m.s1>=need||m.s2>=need)&&m.s1!==m.s2){m.status="done";m.winner=m.s1>m.s2?m.p1:m.p2;m.loser=m.s1>m.s2?m.p2:m.p1;advance(m);freeTable(m.table);m.table=null;assign();}save();render();}
function freeTable(t){for(const m of state.matches)if(m.status==="playing"&&m.table===t)m.table=null}
function assign(){let used=new Set(state.matches.filter(m=>m.status==="playing").map(m=>m.table));for(const m of state.matches.filter(m=>m.status==="waiting")){let t=1;while(used.has(t)&&t<=state.switches)t++;if(t<=state.switches){m.status="playing";m.table=t;used.add(t)}else break}}
function advance(m){
let r=m.round+1;
if(r<=4){let same=state.matches.filter(x=>x.round===r&&x.status==="waiting");let slot=same.find(x=>!x.p1||!x.p2);if(!slot){slot={id:state.next++,p1:null,p2:null,s1:0,s2:0,status:"waiting",round:r,best:r>=3?3:2,bracket:"W"};state.matches.push(slot)}if(!slot.p1)slot.p1=m.winner;else if(!slot.p2)slot.p2=m.winner}
let los=state.matches.find(x=>x.bracket==="L"&&x.status==="waiting"&&(!x.p1||!x.p2));if(m.loser&&los){if(!los.p1)los.p1=m.loser;else los.p2=m.loser}
}
function start(){if(state.players.length<4){alert("4人以上登録してください");return}state.started=true;state.switches=Math.max(1,Math.min(32,Number($("switchCount").value)||4));state.eventName=$("eventName").value.trim()||"Smash Campus Cup";let a=[...state.players];let n=1;while(n<a.length)n*=2;while(a.length<n)a.push("BYE");state.matches=[];state.next=1;for(let i=0;i<a.length;i+=2){let p1=a[i],p2=a[i+1];if(p1==="BYE"||p2==="BYE")continue;state.matches.push({id:state.next++,p1,p2,s1:0,s2:0,status:"waiting",round:1,best:2,bracket:"W"})}assign();save();render();}
$("regForm").addEventListener("submit",e=>{e.preventDefault();if(state.started)return;let n=$("playerName").value.trim();if(n&&!state.players.includes(n)){state.players.push(n);$("playerName").value="";save();render()}});
$("startBtn").onclick=start;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("liveTab").style.display=b.dataset.tab==="live"?"block":"none";$("bracketTab").style.display=b.dataset.tab==="bracket"?"block":"none"});
function renderBracket(){let rounds={};state.matches.forEach(m=>(rounds[m.round]??=[]).push(m));$("bracket").innerHTML=Object.keys(rounds).sort((a,b)=>a-b).map(r=>`<div class="round"><h3>ラウンド ${r} · ${r>=3?"BO3":"BO2"}</h3>${rounds[r].map(m=>`<div class="bm"><div>${esc(m.p1||"未定")} <b>${m.s1}</b></div><div>${esc(m.p2||"未定")} <b>${m.s2}</b></div><div class="tiny">${m.status==="playing"?"台 "+m.table:m.status==="done"?"終了":"待機"}</div></div>`).join("")}</div>`).join("")}
load();render();
</script>
</body>
</html>
