<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, signInAnonymously, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyDVOpwr89QumJoa0RH06Vk99lOvUxDee8A',authDomain:'smash-tournament-7d620.firebaseapp.com',databaseURL:'https://smash-tournament-7d620-default-rtdb.firebaseio.com',projectId:'smash-tournament-7d620',storageBucket:'smash-tournament-7d620.firebasestorage.app',messagingSenderId:'883349497921',appId:'1:883349497921:web:40e3489325f0d1770c7ec0',measurementId:'G-JQLHX9GZK6'};
const ADMIN_UID='yBn5daLPV2bQ3q8A4nJuzDgSRfO2';
const FIRST_MAPS=['戦場','小戦場','終点','ポケスタ2','ホロウバスティオン'];
const LATER_MAPS=[...FIRST_MAPS,'村と街','すま村'];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const eventRef=doc(db,'events','main'),playersRef=collection(eventRef,'players'),matchesRef=collection(eventRef,'matches');
let currentUser=null,event={status:'registration',name:'Smash Tournament',switches:2},players=[],matches=[],unsubs=[];
let authInitialized=false,authError='',resolveAuthReady;const authReady=new Promise(r=>resolveAuthReady=r);
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function admin(){return currentUser?.uid===ADMIN_UID}
function setPage(id){['viewPage','mapsPage','registerPage','adminPage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));['tabView','tabMaps','tabRegister','tabAdmin'].forEach(x=>$(x).classList.toggle('active',x.replace('tab','').toLowerCase()===id.replace('Page','').toLowerCase()))}
$('tabView').onclick=()=>setPage('viewPage');$('tabMaps').onclick=()=>setPage('mapsPage');$('tabRegister').onclick=()=>setPage('registerPage');$('tabAdmin').onclick=()=>setPage('adminPage');
function rounds(n){return Math.ceil(Math.log2(Math.max(2,n)))}
function labelRound(r,total){if(r===total)return '決勝';if(r===total-1)return '準決勝';if(r===total-2)return '準々決勝';return `WB R${r}`}
function boFor(m){return m.round>=m.wbTotal-1?'BO5':'BO3'}
function requiredWins(m){return boFor(m)==='BO5'?3:2}
function player(id){return players.find(p=>p.id===id)}
function playerName(id,fallback='未定'){return player(id)?.name || fallback}
function playerUid(id){return player(id)?.uid||null}
function slotName(id,savedName){return savedName || playerName(id)}
function actingPlayerId(m){const saved=sessionStorage.getItem('actingPlayerId');if(saved&&(saved===m.p1||saved===m.p2)){if(admin()||playerUid(saved)===currentUser?.uid)return saved}if(!admin()&&m.p1Uid===currentUser?.uid&&m.p2Uid!==currentUser?.uid)return m.p1;if(!admin()&&m.p2Uid===currentUser?.uid&&m.p1Uid!==currentUser?.uid)return m.p2;return null}
function eligibleActingPlayers(m){return [m.p1,m.p2].filter(id=>id&&currentUser&&(admin()||playerUid(id)===currentUser.uid))}
function chooseActingPlayer(m,nextAction=''){const ids=eligibleActingPlayers(m);const opts=ids.map(id=>`<option value="${esc(id)}">${esc(playerName(id))}</option>`).join('');if(ids.length===1){sessionStorage.setItem('actingPlayerId',ids[0]);if(nextAction==='map')openMap(m);else if(nextAction==='vote')openVote(m);return}if(!ids.length){alert('この試合を操作できる参加者として認証されていません。');return}$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="title">操作する参加者を選択</div><div class="notice">この試合では、毎回ここで「今から操作する人」を切り替えられます。<br>同じスマホで「あ」→「い」のように交代して操作できます。</div><div class="field"><label>操作する参加者</label><select id="actingPlayerSelect">${opts}</select></div><div class="row"><button id="saveActingPlayer" class="primary" data-acting-match="${esc(m.id)}" data-next-action="${esc(nextAction)}">この参加者として続ける</button><button id="closeActingPlayer">閉じる</button></div></div></div>`}
function normalizePlayers(ps){let n=1;while(n<ps.length)n*=2;return n}

// 正しいダブルエリミネーションの配線。LBは2R-2ラウンドで、余分な「未定vs未定」を作らない。
function makeBracket(ps){
  const N=normalizePlayers(ps),R=Math.log2(N),slots=Array.from({length:N},(_,i)=>ps[i]||null),out=[];
  const base=(id)=>({
    id,bracket:'',round:0,index:0,wbTotal:R,
    p1:null,p2:null,p1Uid:null,p2Uid:null,p1Name:null,p2Name:null,
    s1:0,s2:0,status:'pending',table:null,winner:null,loser:null,
    source1:null,source2:null,game:1,mapState:null,mapHistory:[],votes:{},hidden:false
  });
  for(let r=1;r<=R;r++)for(let i=0;i<N/2**r;i++){
    const m=base(`wb${r}-${i+1}`);m.bracket='WB';m.round=r;m.index=i+1;
    if(r===1){
      const a=slots[i*2],b=slots[i*2+1];
      m.p1=a?.id||null;m.p2=b?.id||null;
      m.p1Uid=a?.uid||null;m.p2Uid=b?.uid||null;
      m.p1Name=a?.name||null;m.p2Name=b?.name||null;
    }
    out.push(m);
  }
  for(let r=2;r<=R;r++)for(let i=0;i<N/2**r;i++){
    const m=out.find(x=>x.id===`wb${r}-${i+1}`);
    m.source1=`wb${r-1}-${i*2+1}`;m.source2=`wb${r-1}-${i*2+2}`;
  }
  const sizes=[];
  for(let k=1;k<=Math.max(0,2*R-2);k++)sizes.push(Math.max(1,Math.floor(N/2**(Math.floor((k+1)/2)+1))));
  for(let k=1;k<=sizes.length;k++)for(let i=0;i<sizes[k-1];i++){
    const m=base(`lb${k}-${i+1}`);m.bracket='LB';m.round=k;m.index=i+1;out.push(m);
  }
  for(let k=1;k<=sizes.length;k++)for(let i=0;i<sizes[k-1];i++){
    const m=out.find(x=>x.id===`lb${k}-${i+1}`);
    if(k===1){m.source1=`loser:wb1-${i*2+1}`;m.source2=`loser:wb1-${i*2+2}`}
    else if(k%2===0){m.source1=`lb${k-1}-${i+1}`;const wr=k/2+1;m.source2=wr<=R?`loser:wb${wr}-${i+1}`:null}
    else {m.source1=`lb${k-1}-${i*2+1}`;m.source2=`lb${k-1}-${i*2+2}`}
  }
  const gf=base('GF-1');gf.bracket='GF';gf.round=R;gf.index=1;gf.source1=`wb${R}-1`;gf.source2=sizes.length?`lb${sizes.length}-1`:null;out.push(gf);
  return out;
}
function sourceInfo(ref){if(!ref)return null;const loser=ref.startsWith('loser:');return {id:loser?ref.slice(6):ref,loser}}
function refreshSources(ms){
  const map=Object.fromEntries(ms.map(m=>[m.id,m]));
  let changed=true,guard=0;
  while(changed&&guard++<80){
    changed=false;
    for(const m of ms){
      for(const side of ['p1','p2']){
        const key=side==='p1'?'source1':'source2';
        const info=sourceInfo(m[key]);
        if(!info)continue;
        const src=map[info.id];
        if(!src || src.status!=='done')continue;
        const id=info.loser?(src.loser||null):(src.winner||null);
        const name=info.loser?(src.loserName||slotName(src.loser)):(src.winnerName||slotName(src.winner));
        const uid=playerUid(id)|| (id===src.p1?src.p1Uid:id===src.p2?src.p2Uid:null);
        const vals={id,name: name||null,uid:uid||null};
        if(m[side]!==vals.id||m[side+'Name']!==vals.name||m[side+'Uid']!==vals.uid){
          m[side]=vals.id;m[side+'Name']=vals.name;m[side+'Uid']=vals.uid;changed=true;
        }
      }
    }
  }
  return ms;
}
// その供給元から「将来プレイヤーが来る可能性」があるかを再帰的に判定する。
// winner経路: どちらか片方でも実在選手が来る可能性があれば true。
// loser経路 : 両方に実在選手が来る可能性がある時だけ true（BYEの敗者は存在しないため）。
function sourceCanProduce(ref,map,seen=new Set()){
  const info=sourceInfo(ref);
  if(!info)return false; // 1回戦の空き枠など、供給元そのものが無い = 将来も誰も来ない
  const key=(info.loser?'L:':'W:')+info.id;
  if(seen.has(key))return false;
  seen.add(key);
  const src=map[info.id];
  if(!src)return false;
  if(src.status==='done')return !!(info.loser?src.loser:src.winner);
  const p1Possible=!!src.p1 || sourceCanProduce(src.source1,map,new Set(seen));
  const p2Possible=!!src.p2 || sourceCanProduce(src.source2,map,new Set(seen));
  return info.loser ? (p1Possible&&p2Possible) : (p1Possible||p2Possible);
}
function sideCanStillReceive(m,side,map){
  if(m[side])return true;
  const ref=side==='p1'?m.source1:m.source2;
  return sourceCanProduce(ref,map);
}
function autoByes(ms){
  const map=Object.fromEntries(ms.map(m=>[m.id,m]));let did=false;
  for(const m of ms){
    if(m.status!=='pending')continue;
    const a=m.p1,b=m.p2;
    const aPossible=sideCanStillReceive(m,'p1',map);
    const bPossible=sideCanStillReceive(m,'p2',map);

    // 片方に実在選手がいる場合、空いている側の「前の枝」を確認する。
    // そこから将来選手が来る可能性があるなら待機。完全な空枝なら不戦勝で進める。
    if(a&&!b){
      if(bPossible)continue;
      m.status='done';m.winner=a;m.loser=null;m.winnerName=slotName(a,m.p1Name);m.loserName=null;m.s1=0;m.s2=0;m.hidden=false;did=true;
    }else if(!a&&b){
      if(aPossible)continue;
      m.status='done';m.winner=b;m.loser=null;m.winnerName=slotName(b,m.p2Name);m.loserName=null;m.s1=0;m.s2=0;m.hidden=false;did=true;
    }else if(!a&&!b){
      // 「未定 vs 未定」は表示には残す。
      // ただし両方の枝が完全に空なら内部的には終了させ、上位ラウンドが永久に待たないようにする。
      if(aPossible||bPossible)continue;
      m.status='done';m.winner=null;m.loser=null;m.winnerName=null;m.loserName=null;m.s1=0;m.s2=0;m.hidden=false;did=true;
    }
  }
  return did;
}
function ready(m){return m.status==='pending'&&!!m.p1&&!!m.p2}
function matchOrder(m){if(m.bracket==='WB')return m.round*1000+m.index;if(m.bracket==='LB')return 10000+m.round*1000+m.index;return 30000}
function stageName(m){return m.bracket==='WB'?labelRound(m.round,m.wbTotal):m.bracket==='LB'?`敗者側 R${m.round}`:'グランドファイナル'}
function updateStatuses(ms){for(const m of ms){if(m.status==='done')continue;if(ready(m)&&!m.table&&m.status==='pending')m.status='waiting'}return ms}

async function reconcileAndAssign(){

  const fresh=matches.map(m=>({...m,mapHistory:Array.isArray(m.mapHistory)?m.mapHistory:[],votes:m.votes||{}}));

    }
    return {stages,maxRound,boardH};
  };

async function buildTournamentFromCurrentRoster(label='大会を開始しました！'){
  const snap=await getDocs(playersRef);
  const roster=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.name&&p.uid);
  if(roster.length<2)throw new Error(`参加者が2人以上必要です。（現在 ${roster.length}人）`);
  roster.sort((a,b)=>{
    const at=a.createdAt?.toMillis?a.createdAt.toMillis():0;
    const bt=b.createdAt?.toMillis?b.createdAt.toMillis():0;
    return at-bt;
  });
  players=roster;
  const built=makeBracket(roster);
  await deleteAllMatches();
  const batch=writeBatch(db);
  built.forEach(m=>batch.set(doc(matchesRef,m.id),m));
  batch.set(eventRef,{status:'started',startedAt:event.startedAt||serverTimestamp(),playerCount:roster.length},{merge:true});
  await batch.commit();
  $('adminMsg').textContent=`${label} ${roster.length}人の名簿を反映しました。`;
  setTimeout(reconcileAndAssign,250);
}
async function startTournament(){
  if(!admin()||event.status==='started')return;
  try{await buildTournamentFromCurrentRoster('大会を開始しました！')}catch(e){console.error(e);$('adminMsg').textContent='大会開始に失敗しました: '+(e.message||e)}
}
async function rebuildTournament(){
  if(!admin()||event.status!=='started')return;
  if(!confirm('現在の参加者名簿をそのまま使って、トーナメント表と試合データを再生成します。進行中の試合結果は消えます。よろしいですか？'))return;
  try{await buildTournamentFromCurrentRoster('大会表を再生成しました！')}catch(e){console.error(e);$('adminMsg').textContent='再生成に失敗しました: '+(e.message||e)}
}
async function deleteAllMatches(){const snap=await getDocs(matchesRef);const b=writeBatch(db);snap.forEach(d=>b.delete(d.ref));await b.commit()}
async function deleteAllPlayers(){const snap=await getDocs(playersRef);if(snap.empty)return;let batch=writeBatch(db),count=0;for(const d of snap.docs){batch.delete(d.ref);count++;if(count===450){await batch.commit();batch=writeBatch(db);count=0}}if(count)await batch.commit()}
document.addEventListener('click',async e=>{const close=e.target.closest('#closeMapBtn,#closeVoteBtn');if(close){$('modalRoot').innerHTML='';return}const saveActor=e.target.closest('#saveActingPlayer');if(saveActor){const id=$('actingPlayerSelect').value;const mid=saveActor.dataset.actingMatch;const next=saveActor.dataset.nextAction;sessionStorage.setItem('actingPlayerId',id);$('modalRoot').innerHTML='';const mm=matches.find(x=>x.id===mid);if(mm){if(next==='map')openMap(mm);else if(next==='vote')openVote(mm)}return}const closeActor=e.target.closest('#closeActingPlayer');if(closeActor){$('modalRoot').innerHTML='';return}const mb=e.target.closest('[data-open-map]');if(mb){const m=matches.find(x=>x.id===mb.dataset.openMap);if(m){const ids=eligibleActingPlayers(m);if(ids.length>1)chooseActingPlayer(m,'map');else if(ids.length===1){sessionStorage.setItem('actingPlayerId',ids[0]);openMap(m)}else alert('この試合を操作できる参加者として認証されていません。')}return}const mapb=e.target.closest('[data-map-match]');if(mapb){const m=matches.find(x=>x.id===mapb.dataset.mapMatch);if(m)try{await mapAction(m,mapb.dataset.mapName)}catch(err){alert('マップ操作に失敗しました: '+err.message)}return}const vb=e.target.closest('[data-open-vote]');if(vb){const m=matches.find(x=>x.id===vb.dataset.openVote);if(m){const ids=eligibleActingPlayers(m);if(ids.length>1)chooseActingPlayer(m,'vote');else if(ids.length===1){sessionStorage.setItem('actingPlayerId',ids[0]);openVote(m)}else alert('この試合を操作できる参加者として認証されていません。')}return}const vote=e.target.closest('[data-vote-match]');if(vote){const m=matches.find(x=>x.id===vote.dataset.voteMatch);if(m)try{const actor=$('voteActorSelect')?.value||null;await submitVote(m,vote.dataset.winner,actor);if($('modalRoot').innerHTML&&m.status==='playing')openVote({...m,...(matches.find(x=>x.id===m.id)||{})});}catch(err){alert('投票に失敗しました: '+err.message)}return}});
subscribe();bootstrapAnon();
